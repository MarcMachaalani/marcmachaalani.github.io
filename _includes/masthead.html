<header class="journal-head">
  <a class="skip" href="#main">Skip to content</a>
  <a class="signature" href="{{ '/' | relative_url }}"><span aria-hidden="true">MM</span>{{ site.title }}</a>
  <nav aria-label="Main navigation">
    {% for link in site.data.navigation.main %}
      <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
    {% endfor %}
  </nav>
  <button type="button" class="appearance" aria-label="Dark appearance" aria-pressed="false" title="Toggle dark appearance">◐</button>
</header>
