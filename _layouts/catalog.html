---
layout: default
---
<main id="main" class="catalog">
  <header class="catalog-title">
    <p class="home-eyebrow">{{ page.section_label | default: "Academic record" }}{% if page.folio %} <span aria-hidden="true">/</span> {{ page.folio }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    <p>{{ page.intro }}</p>
  </header>
  <div data-content-body>{{ content }}</div>
</main>
