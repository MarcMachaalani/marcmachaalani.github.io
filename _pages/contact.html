---
layout: default
permalink: /contact/
title: "Get in touch"
---
<main id="main">
  <header class="catalog-title">
    <h1>Get in touch</h1>
    <p>I welcome questions about my research and opportunities to collaborate.</p>
  </header>
  {% if site.contact_endpoint and site.contact_endpoint != empty %}
    <form class="contact-form" method="post" action="{{ site.contact_endpoint | escape }}">
      <label for="reply-email">Your email</label>
      <input id="reply-email" name="email" type="email" autocomplete="email" required>
      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" rows="6" required></textarea>
      <button class="portfolio-button portfolio-button--primary" type="submit">Send message</button>
    </form>
  {% else %}
    <p>You can reach me through <a href="{{ site.author.researchgate }}">my ResearchGate profile</a>.</p>
  {% endif %}
</main>
